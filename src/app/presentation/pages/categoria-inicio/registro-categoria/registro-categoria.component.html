<div class="container">
  <mat-card class="container__card">
    <mat-card-header class="container__header">
      <mat-card-title class="container__title">Registro de categorías</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form class="form" novalidate>
        <mat-form-field appearance="outline" class="form__field">
          <mat-label>Código</mat-label>
          <input id="codigo" matInput type="text" [value]="categoriaModel().codigo" readonly aria-label="Código"/>
        </mat-form-field>

        <mat-form-field appearance="outline" class="form__field">
          <mat-label>Nombre</mat-label>
          <input id="nombre" matInput type="text" [formField]="categoriaForm.nombre" aria-label="Nombre" />

          @if (categoriaForm.nombre().touched() && categoriaForm.nombre().invalid()) {
            <mat-error class="form__error">
              {{ categoriaForm.nombre().errors()[0]?.message }}
            </mat-error>
          }
        </mat-form-field>

        <mat-checkbox [formField]="categoriaForm.estado">Activo</mat-checkbox>

        <div class="form__action">
          <button class="form__button form__button--primary" mat-raised-button type="button" [disabled]="guardando()"(click)="registrarCategoria()">Registrar</button>
          <button class="form__button form__button--secondary" mat-stroked-button type="button" (click)="regresar()">Regresar</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
