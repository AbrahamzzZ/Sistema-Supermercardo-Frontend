<div class="container">
  <h1 class="container__title">Usuarios del MarketEase</h1>
  <div class="container__table">
    <div class="container__search">
      <mat-form-field class="container__search__input" appearance="outline">
        <mat-label>Buscar usuario</mat-label>
        <input
          matInput
          #searchInput
          (keyup)="filtrarUsuarios(searchInput.value)"
          placeholder="Buscar usuarios por varios criterios."
        />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>

      <button class="container__search__button" mat-raised-button color="primary" (click)="nuevo()">
        <mat-icon>person_add</mat-icon> Registrar usuario
      </button>

      <button
        class="container__excel__button"
        mat-raised-button
        color="accent"
        (click)="exportarExcel()"
      >
        <mat-icon class="container__excel__icon">file_download</mat-icon> Exportar a Excel
      </button>
    </div>

    <app-data-table
      [dataSource]="listaUsuario"
      [columns]="columns"
      [totalRegistros]="totalRegistros"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 20]"
      mensajeSinDatos="No hay usuarios que mostrar."
      (editar)="editar($event)"
      (eliminar)="eliminar($event)"
      (cambioPagina)="cambiarPagina($event)"
    ></app-data-table>
  </div>
</div>

<router-outlet></router-outlet>
