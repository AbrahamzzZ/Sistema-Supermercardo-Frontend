<div class="container">
  <h1 class="container__title">Log</h1>
  <div class="container__table">
    <div class="container__search">
      <mat-form-field class="container__search__input" appearance="outline">
        <mat-label>Buscar Logs</mat-label>
        <input
          matInput
          #searchInput
          (keyup)="filtrar(searchInput.value)"
          placeholder="Buscar logs por varios criterios."
        />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>

      <!-- Rango de fechas y exportación en la misma fila, alineados verticalmente -->
      <div class="container__search__acciones">
        <!-- Rango de fechas: filtra la lista y define qué se exporta (máximo 3 meses para Excel) -->
        <mat-form-field class="container__search__fechas" appearance="outline">
          <mat-date-range-input
            [rangePicker]="rangoFechas"
            [max]="hoy"
            aria-label="Rango de fechas"
          >
            <input
              matStartDate
              placeholder="Desde"
              [value]="desde()"
              (dateChange)="cambiarDesde($event.value)"
              aria-label="Fecha desde"
            />
            <input
              matEndDate
              placeholder="Hasta"
              [value]="hasta()"
              (dateChange)="cambiarHasta($event.value)"
              aria-label="Fecha hasta"
            />
          </mat-date-range-input>
          <mat-datepicker-toggle matIconSuffix [for]="rangoFechas"></mat-datepicker-toggle>
          <mat-date-range-picker #rangoFechas></mat-date-range-picker>
        </mat-form-field>

        <button
          class="container__excel__button"
          mat-raised-button
          color="accent"
          (click)="exportarExcel()"
        >
          <mat-icon class="container__excel__icon">file_download</mat-icon> Exportar a Excel
        </button>
      </div>
    </div>

    <app-data-table
      [dataSource]="listaData"
      [cargando]="cargando()"
      [columns]="columns"
      [totalRegistros]="totalRegistros()"
      [pageSize]="pageSize()"
      [pageIndex]="pagina() - 1"
      [pageSizeOptions]="[5, 10, 20]"
      mensajeSinDatos="No hay logs que mostrar."
      (ver)="ver($event)"
      (cambioPagina)="cambiarPagina($event)"
    ></app-data-table>
  </div>
</div>

<router-outlet></router-outlet>
